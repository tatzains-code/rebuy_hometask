spring:
  application:
    name: shortener
  datasource:
    # Overridden in Docker via SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shortener}
    username: ${SPRING_DATASOURCE_USERNAME:shortener}
    password: ${SPRING_DATASOURCE_PASSWORD:shortener}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine
    # Pre-creates the cache at startup so cache metrics bind to it immediately,
    # instead of only on its first (lazy) use.
    cache-names: targetUrls
    caffeine:
      spec: maximumSize=100000,expireAfterAccess=1h,recordStats

server:
  port: 8080
  error:
    include-stacktrace: never

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  code:
    # The affine permutation's multiplier/offset MUST NOT change once data
    # exists (see CLAUDE.md) — overridable only for local experimentation.
    multiplier: ${APP_CODE_MULTIPLIER:9132277}
    offset: ${APP_CODE_OFFSET:4861105}
    reserved:
      - docs
      - help
      - info
      - home
      - "null"
      - test
      - root
      - user
      - html

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: url-shortener
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    root: INFO
